name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Windows PowerShell 5.1, а не pwsh: build.ps1 работает с классическими
      # сборками .NET Framework (System.IO.Compression, csc.exe из v4.0.30319)
      - name: Собрать пакет
        shell: powershell
        run: .\build.ps1

      - name: Показать содержимое пакета
        shell: powershell
        run: Get-ChildItem dist | Format-List Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: SMTC-Player
          path: |
            dist/SMTC-Player.rmskin
            dist/Shard-Player.zip
          if-no-files-found: error

      # Два пакета: скин Rainmeter вместе с треем и отдельный Shard Player
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SMTC-Player.rmskin
            dist/Shard-Player.zip
